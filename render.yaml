services:
  # ─── Backend API (Python/FastAPI) ───
  # NOTE: The React frontend is deployed separately to Vercel (see vercel.json
  # and deploy_instructions.md). Do not re-add a static_site here.
  - type: web
    name: xplora-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Pin the native Python runtime (Render reads PYTHON_VERSION)
      - key: PYTHON_VERSION
        value: "3.12"
      # Required
      - key: GROQ_API_KEY
        sync: true
      # Neon (serverless Postgres). Use the POOLED endpoint; the secret lives in
      # the Render service's environment, never in the repo.
      - key: DATABASE_URL
        sync: true
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated frontend origins allowed to send the session cookie.
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://xplora-travel-agent.vercel.app"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # Recommended / optional (leave blank if unused)
      - key: OPENROUTER_API_KEY
        sync: true
      - key: TOMORROW_IO_API_KEY
        sync: true
      - key: SCRAPEGRAPH_API_KEY
        sync: true
      - key: GOOGLE_PLACES_API_KEY
        sync: true
      - key: EXCHANGERATE_API_KEY
        sync: true
      - key: PINECONE_API_KEY
        sync: true
      - key: PINECONE_INDEX_NAME
        value: "travel-guides"
