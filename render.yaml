services:
  # ─── Backend API (Python/FastAPI) ───
  - type: web
    name: xplora-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: true
      - key: OPENROUTER_API_KEY
        sync: true
      - key: TOMORROW_IO_API_KEY
        sync: true
      - key: MYSQL_HOST
        sync: true
      - key: MYSQL_USER
        sync: true
      - key: MYSQL_PASSWORD
        sync: true
      - key: MYSQL_DATABASE
        sync: true
      - key: MYSQL_PORT
        value: "3306"

  # ─── Frontend (Static Site) ───
  - type: static_site
    name: xplora-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: xplora-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
