services:
  # ─── Backend API (Python/FastAPI) ───
  # NOTE: The React frontend is deployed separately to Vercel (see vercel.json
  # and deploy_instructions.md). Do not re-add a static_site here.
  # IMPORTANT: 'name' must equal the Render service's NAME, not its URL. The live
  # service is reachable at https://xplora-backend-b3gn.onrender.com (Render added
  # the -b3gn suffix because the URL slug was taken). Verify the exact service name
  # in the Render dashboard before changing this, or Render will provision a duplicate.
  - type: web
    name: xplora-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Pin the native Python runtime (Render reads PYTHON_VERSION)
      - key: PYTHON_VERSION
        value: "3.12"
      # Required
      - key: GROQ_API_KEY
        sync: true
      - key: MYSQL_HOST
        sync: true
      - key: MYSQL_USER
        sync: true
      - key: MYSQL_PASSWORD
        sync: true
      - key: MYSQL_DATABASE
        sync: true
      - key: MYSQL_PORT
        value: "3306"
      # Recommended / optional (leave blank if unused)
      - key: OPENROUTER_API_KEY
        sync: true
      - key: TOMORROW_IO_API_KEY
        sync: true
      - key: SCRAPEGRAPH_API_KEY
        sync: true
      - key: GOOGLE_PLACES_API_KEY
        sync: true
      - key: EXCHANGERATE_API_KEY
        sync: true
      - key: PINECONE_API_KEY
        sync: true
      - key: PINECONE_INDEX_NAME
        value: "travel-guides"
